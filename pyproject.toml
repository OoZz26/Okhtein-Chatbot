[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "okhtein-bot"
version = "0.1.0"
description = "WhatsApp sales chatbot for Okhtein"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "openai",
    "numpy",
    "redis",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pgvector",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "fakeredis", "locust"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.services.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs the Docker services (Postgres, Redis) to be running"]
